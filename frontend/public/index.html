<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MailMind AI — Executive Email Intelligence</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════════════════════════
   CSS DESIGN SYSTEM — MAILMIND AI EXECUTIVE WORKSPACE
   ═══════════════════════════════════════════════════════════ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font-sans:'Inter',system-ui,sans-serif;
  --font-display:'Plus Jakarta Sans',system-ui,sans-serif;
  --sidebar-w:260px;--list-w:360px;

  /* Light theme */
  --bg:#f5f5f7;--canvas:#ffffff;--surface:#ffffff;--surface2:#f9fafb;
  --border:#e5e7eb;--border2:#f0f0f2;
  --txt-primary:#111827;--txt-secondary:#6b7280;--txt-muted:#9ca3af;
  --blue:#2563eb;--blue-lt:#dbeafe;--blue-dk:#1d4ed8;
  --red:#dc2626;--red-lt:#fee2e2;
  --orange:#d97706;--orange-lt:#fef3c7;
  --green:#059669;--green-lt:#d1fae5;
  --purple:#7c3aed;--purple-lt:#ede9fe;
  --cyan:#0891b2;--cyan-lt:#cffafe;
  --shadow-xs:0 1px 2px rgba(0,0,0,.05);
  --shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg:0 10px 25px -5px rgba(0,0,0,.08),0 4px 10px -6px rgba(0,0,0,.05);
  --shadow-xl:0 20px 40px -10px rgba(0,0,0,.12),0 8px 16px -8px rgba(0,0,0,.08);
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;--radius-xl:20px;--radius-pill:999px;
  --transition:.18s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0b0f19;--canvas:#111827;--surface:#111827;--surface2:#1a2234;
  --border:#1f2937;--border2:#263044;
  --txt-primary:#f9fafb;--txt-secondary:#9ca3af;--txt-muted:#6b7280;
  --blue-lt:rgba(37,99,235,.18);
  --shadow-xs:0 1px 2px rgba(0,0,0,.3);
  --shadow-sm:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.2);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,.4),0 2px 4px -2px rgba(0,0,0,.2);
  --shadow-lg:0 10px 25px -5px rgba(0,0,0,.5),0 4px 10px -6px rgba(0,0,0,.3);
}

body{font-family:var(--font-sans);background:var(--bg);height:100vh;overflow:hidden;color:var(--txt-primary);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
#app{display:flex;flex-direction:column;height:100vh}

/* ── AMBIENT RADIAL GLOWS ── */
.glow-critical{box-shadow:0 0 0 1px #dc2626,0 0 20px rgba(220,38,38,.15)}
.glow-high{box-shadow:0 0 0 1px #d97706,0 0 16px rgba(217,119,6,.12)}

/* ── TOPBAR ── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 20px;height:60px;
  background:var(--canvas);border-bottom:1px solid var(--border);
  z-index:200;flex-shrink:0;
}
.logo{display:flex;align-items:center;gap:10px;min-width:220px}
.logo-mark{
  width:34px;height:34px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;
  font-size:17px;box-shadow:0 4px 12px rgba(37,99,235,.3);flex-shrink:0;
}
.logo-name{font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--txt-primary)}
.logo-ai{
  font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;border-radius:4px;padding:2px 6px;
}

/* Search */
.search-wrap{flex:1;position:relative;max-width:680px}
.search-input{
  width:100%;height:40px;border:1.5px solid var(--border);
  background:var(--surface2);border-radius:var(--radius-pill);
  padding:0 16px 0 42px;font-size:14px;font-family:var(--font-sans);
  color:var(--txt-primary);outline:none;transition:var(--transition);
}
.search-input::placeholder{color:var(--txt-muted)}
.search-input:focus{border-color:var(--blue);background:var(--canvas);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--txt-muted)}
.search-kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--txt-muted);background:var(--border);border-radius:4px;padding:1px 6px;font-family:monospace}

.topbar-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.icon-btn{
  width:36px;height:36px;border:none;background:transparent;
  border-radius:var(--radius-md);cursor:pointer;font-size:16px;
  display:flex;align-items:center;justify-content:center;
  color:var(--txt-secondary);transition:var(--transition);
}
.icon-btn:hover{background:var(--surface2);color:var(--txt-primary)}
.theme-toggle{font-size:17px}

/* Status pill */
.status-pill{
  display:flex;align-items:center;gap:6px;
  padding:4px 12px;border-radius:var(--radius-pill);font-size:12px;font-weight:500;
}
.status-online{background:var(--green-lt);color:var(--green)}
.status-offline{background:var(--red-lt);color:var(--red)}
.pulse-dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;
  animation:pulse-anim 2s ease-in-out infinite;
}
@keyframes pulse-anim{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}

.avatar{
  width:34px;height:34px;border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#059669);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:13px;cursor:pointer;flex-shrink:0;
  font-family:var(--font-display);
}

/* ── BODY LAYOUT ── */
.body-wrap{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
.sidebar{
  width:var(--sidebar-w);flex-shrink:0;
  background:var(--canvas);overflow-y:auto;
  border-right:1px solid var(--border);
  padding:12px 0;display:flex;flex-direction:column;
}
.compose-btn{
  display:flex;align-items:center;gap:10px;
  margin:0 12px 16px;padding:12px 18px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:#fff;border:none;border-radius:var(--radius-lg);
  cursor:pointer;font-size:14px;font-weight:600;font-family:var(--font-sans);
  box-shadow:0 4px 14px rgba(37,99,235,.35);
  transition:var(--transition);letter-spacing:-.01em;
}
.compose-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(37,99,235,.45)}
.compose-btn .c-icon{font-size:17px}

.nav-label{
  padding:8px 18px 4px;font-size:10.5px;font-weight:600;
  color:var(--txt-muted);text-transform:uppercase;letter-spacing:.08em;
}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:9px 18px;cursor:pointer;
  border-radius:0 var(--radius-pill) var(--radius-pill) 0;
  margin-right:12px;font-size:13.5px;color:var(--txt-secondary);
  transition:var(--transition);position:relative;font-weight:500;
}
.nav-item:hover{background:var(--surface2);color:var(--txt-primary)}
.nav-item.active{background:var(--blue-lt);color:var(--blue);font-weight:600}
.nav-item .ni{font-size:17px;width:20px;text-align:center;flex-shrink:0}
.nav-badge{
  margin-left:auto;background:var(--txt-secondary);color:var(--canvas);
  border-radius:var(--radius-pill);padding:1px 7px;font-size:10.5px;font-weight:600;
}
.nav-item.active .nav-badge{background:var(--blue);color:#fff}
.nav-divider{height:1px;background:var(--border);margin:10px 18px}
.sidebar-footer{margin-top:auto;padding:12px}

/* ── EMAIL LIST ── */
.email-list{
  width:var(--list-w);flex-shrink:0;
  display:flex;flex-direction:column;
  border-right:1px solid var(--border);
  background:var(--canvas);overflow:hidden;
}
.list-header{
  display:flex;align-items:center;gap:8px;
  padding:14px 18px 10px;border-bottom:1px solid var(--border);flex-shrink:0;
}
.list-title{font-size:16px;font-weight:700;color:var(--txt-primary);font-family:var(--font-display)}
.count-badge{
  font-size:11px;color:var(--txt-muted);background:var(--surface2);
  padding:2px 8px;border-radius:var(--radius-pill);font-weight:500;
}
.filter-tabs{display:flex;gap:4px;padding:8px 16px;border-bottom:1px solid var(--border2);overflow-x:auto;flex-shrink:0}
.filter-tab{
  padding:5px 13px;border-radius:var(--radius-pill);border:1.5px solid var(--border);
  background:transparent;font-size:11.5px;cursor:pointer;color:var(--txt-secondary);
  white-space:nowrap;transition:var(--transition);font-weight:500;font-family:var(--font-sans);
}
.filter-tab:hover{border-color:var(--blue);color:var(--blue)}
.filter-tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.email-items{overflow-y:auto;flex:1}

/* Email Row */
.email-row{
  display:flex;align-items:flex-start;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--border2);
  cursor:pointer;transition:background var(--transition);position:relative;
}
.email-row:hover{background:var(--surface2)}
.email-row.selected{background:var(--blue-lt)}
.email-row.unread .row-sender,.email-row.unread .row-subject{font-weight:700;color:var(--txt-primary)}
.prio-stripe{width:3px;border-radius:2px;flex-shrink:0;align-self:stretch;min-height:50px;margin-top:1px}
.row-body{flex:1;min-width:0}
.row-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:2px}
.row-sender{font-size:13.5px;color:var(--txt-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row-time{font-size:11px;color:var(--txt-muted);flex-shrink:0}
.row-subject{font-size:13.5px;color:var(--txt-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.row-snippet{font-size:12px;color:var(--txt-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:5px}
.row-tags{display:flex;gap:4px;flex-wrap:wrap}
.rtag{font-size:10px;padding:1.5px 7px;border-radius:var(--radius-pill);font-weight:600;letter-spacing:.02em}
.rtag-critical{color:#dc2626;background:#fee2e2;border:1px solid #fca5a5}
.rtag-high{color:#b45309;background:#fef3c7;border:1px solid #fcd34d}
.rtag-medium{color:#2563eb;background:#dbeafe;border:1px solid #93c5fd}
.rtag-low{color:#059669;background:#d1fae5;border:1px solid #6ee7b7}
.rtag-cat{color:var(--txt-secondary);background:var(--surface2);border:1px solid var(--border)}
.rtag-actions{color:var(--purple);background:var(--purple-lt);border:1px solid #c4b5fd}
.rtag-deadline{color:var(--orange);background:var(--orange-lt);border:1px solid #fcd34d}

/* ── READING PANE ── */
.reading-pane{flex:1;overflow-y:auto;background:var(--bg);display:flex;flex-direction:column}
.reading-pane.empty{align-items:center;justify-content:center;color:var(--txt-muted)}
.reading-pane.empty .ei{font-size:56px;margin-bottom:16px;opacity:.35}
.reading-pane.empty p{font-size:15px;font-weight:500}
.reading-pane.empty .hint{font-size:12px;margin-top:6px;opacity:.7}

.email-detail{padding:28px 36px 40px;max-width:860px;width:100%;margin:0 auto}
.detail-subject{
  font-size:22px;font-weight:700;color:var(--txt-primary);
  font-family:var(--font-display);margin-bottom:14px;line-height:1.3;
  letter-spacing:-.03em;
}
.detail-meta{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.meta-av{
  width:42px;height:42px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#2563eb,#059669);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:16px;font-family:var(--font-display);
}
.meta-info{flex:1}
.meta-from{font-size:14px;font-weight:600;color:var(--txt-primary)}
.meta-to{font-size:12px;color:var(--txt-muted)}
.meta-time{font-size:12px;color:var(--txt-muted);flex-shrink:0}

/* Priority badge (reading pane) */
.priority-badge{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:var(--radius-pill);font-size:11px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
}
.pb-critical{background:var(--red-lt);color:var(--red)}
.pb-high{background:var(--orange-lt);color:var(--orange)}
.pb-medium{background:var(--blue-lt);color:var(--blue)}
.pb-low{background:var(--green-lt);color:var(--green)}

/* Animated critical pulse ring */
.critical-ring{
  display:inline-flex;align-items:center;justify-content:center;
  position:relative;
}
.critical-ring::before{
  content:'';position:absolute;inset:-4px;border-radius:var(--radius-pill);
  background:rgba(220,38,38,.15);animation:crit-pulse 1.8s ease-in-out infinite;
}
@keyframes crit-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.5}}

.detail-actions{display:flex;gap:8px;margin:16px 0;padding:16px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.d-btn{
  display:flex;align-items:center;gap:6px;padding:7px 16px;
  border-radius:var(--radius-pill);border:1.5px solid var(--border);
  background:var(--canvas);cursor:pointer;font-size:13px;color:var(--txt-secondary);
  transition:var(--transition);font-weight:500;font-family:var(--font-sans);
}
.d-btn:hover{background:var(--surface2);border-color:var(--blue);color:var(--blue);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.d-btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.d-btn.primary:hover{background:var(--blue-dk)}

/* Smart reply chips */
.smart-replies{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 20px}
.smart-reply-chip{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:var(--radius-pill);
  border:1.5px solid var(--border);background:var(--canvas);
  cursor:pointer;font-size:12.5px;font-weight:500;color:var(--txt-secondary);
  transition:var(--transition);font-family:var(--font-sans);
}
.smart-reply-chip:hover{border-color:var(--blue);color:var(--blue);background:var(--blue-lt);transform:translateY(-1px);box-shadow:var(--shadow-sm)}

.email-body-text{
  font-size:14px;line-height:1.75;color:var(--txt-primary);
  white-space:pre-wrap;padding:20px 0 24px;
}

/* ── NLP ANALYSIS PANEL ── */
.nlp-section{margin-top:4px;display:flex;flex-direction:column;gap:10px}
.nlp-card{
  border:1.5px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;
  background:var(--canvas);transition:box-shadow var(--transition);
}
.nlp-card:hover{box-shadow:var(--shadow-sm)}
.nlp-header{
  display:flex;align-items:center;gap:10px;padding:11px 16px;
  background:var(--surface2);cursor:pointer;border-bottom:1px solid var(--border);
}
.nlp-header h4{font-size:13px;font-weight:600;color:var(--txt-primary);flex:1;font-family:var(--font-display)}
.nlp-header .chevron{color:var(--txt-muted);font-size:11px;transition:transform var(--transition)}
.nlp-body{padding:14px 16px}

/* Urgency confidence SVG gauge */
.conf-gauge-wrap{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.conf-gauge{position:relative;width:64px;height:64px;flex-shrink:0}
.gauge-svg{transform:rotate(-90deg)}
.gauge-bg{fill:none;stroke:var(--border);stroke-width:5}
.gauge-fill{fill:none;stroke-width:5;stroke-linecap:round;transition:stroke-dasharray 1s ease}
.gauge-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.gauge-pct{font-size:14px;font-weight:700;color:var(--txt-primary);line-height:1}
.gauge-sub{font-size:9px;color:var(--txt-muted);text-transform:uppercase;letter-spacing:.05em;margin-top:1px}

/* Signal breakdown */
.signal-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border2)}
.signal-row:last-child{border-bottom:none}
.signal-name{flex:1;font-size:12px;color:var(--txt-secondary)}
.signal-weight{font-size:11px;font-weight:700;padding:1px 8px;border-radius:var(--radius-pill)}
.signal-pos{background:var(--green-lt);color:var(--green)}
.signal-neg{background:var(--red-lt);color:var(--red)}

/* Action item checklist */
.task-progress{margin-bottom:10px}
.task-progress-bar{height:5px;border-radius:var(--radius-pill);background:var(--border);overflow:hidden;margin-top:5px}
.task-progress-fill{height:100%;border-radius:var(--radius-pill);background:var(--green);transition:width .5s ease}
.task-row{
  display:flex;align-items:flex-start;gap:10px;padding:8px 0;
  border-bottom:1px solid var(--border2);
}
.task-row:last-child{border-bottom:none}
.task-check{
  width:18px;height:18px;border:2px solid var(--border);border-radius:5px;
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  margin-top:1px;transition:var(--transition);
}
.task-check.done{background:var(--green);border-color:var(--green);color:#fff}
.task-check:not(.done):hover{border-color:var(--blue)}
.task-info{flex:1;min-width:0}
.task-action{font-size:13px;color:var(--txt-primary);line-height:1.4}
.task-action.done{text-decoration:line-through;color:var(--txt-muted)}
.task-meta{display:flex;gap:8px;margin-top:3px;flex-wrap:wrap}
.task-pill{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:var(--radius-pill)}
.tp-assignee{background:var(--blue-lt);color:var(--blue)}
.tp-deadline{background:var(--orange-lt);color:var(--orange)}
.tp-high{background:var(--red-lt);color:var(--red)}
.tp-normal{background:var(--surface2);color:var(--txt-muted)}

/* Deadline countdown chips */
.deadline-chip{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:var(--radius-pill);margin:3px;
  font-size:12px;font-weight:500;border:1.5px solid;
}
.dc-critical{background:#fee2e2;border-color:#fca5a5;color:#dc2626}
.dc-urgent{background:#fef3c7;border-color:#fcd34d;color:#b45309}
.dc-normal{background:var(--blue-lt);border-color:#93c5fd;color:#2563eb}

/* Executive brief */
.exec-brief{background:var(--surface2);border-radius:var(--radius-md);padding:14px 16px;margin-bottom:10px}
.eb-title{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--txt-muted);margin-bottom:10px}
.eb-row{display:flex;gap:8px;align-items:flex-start;padding:4px 0}
.eb-icon{font-size:14px;flex-shrink:0;margin-top:1px}
.eb-label{font-size:11px;font-weight:700;color:var(--txt-muted);min-width:72px;flex-shrink:0;padding-top:1px;text-transform:uppercase;letter-spacing:.04em}
.eb-text{font-size:12.5px;color:var(--txt-primary);line-height:1.5}

/* ── DASHBOARD ── */
.dash-wrap{flex:1;overflow-y:auto;padding:28px 36px;background:var(--bg)}
.dash-heading{font-family:var(--font-display);font-size:24px;font-weight:700;color:var(--txt-primary);margin-bottom:4px;letter-spacing:-.04em}
.dash-sub{font-size:13.5px;color:var(--txt-muted);margin-bottom:28px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px}
.stat-card{
  background:var(--canvas);border-radius:var(--radius-lg);padding:18px 16px;
  border:1.5px solid var(--border);box-shadow:var(--shadow-xs);
  transition:var(--transition);cursor:default;
}
.stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px)}
.stat-icon{font-size:22px;margin-bottom:8px}
.stat-val{font-size:30px;font-weight:800;line-height:1;font-family:var(--font-display);color:var(--txt-primary)}
.stat-label{font-size:11.5px;color:var(--txt-muted);font-weight:500;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}

.section-hd{font-size:14px;font-weight:700;color:var(--txt-primary);margin:24px 0 12px;font-family:var(--font-display)}
.briefing-card{background:var(--canvas);border-radius:var(--radius-lg);border:1.5px solid var(--border);padding:20px;box-shadow:var(--shadow-xs)}
.briefing-card p{font-size:14px;color:var(--txt-primary);line-height:1.65}

kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 5px;border:1px solid var(--border);border-radius:4px;font-size:10px;font-family:monospace;color:var(--txt-muted);background:var(--surface2)}

<body>
<div id="app"></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;
const API="http://127.0.0.1:8000";

// ── Helpers ─────────────────────────────────────────────────────────────────
const PC={CRITICAL:"#dc2626",HIGH:"#d97706",MEDIUM:"#2563eb",LOW:"#059669"};
const pColor=p=>PC[p]||"#6b7280";
const pClass=p=>({CRITICAL:"rtag-critical",HIGH:"rtag-high",MEDIUM:"rtag-medium",LOW:"rtag-low"}[p]||"rtag-cat");
const pbClass=p=>({CRITICAL:"pb-critical",HIGH:"pb-high",MEDIUM:"pb-medium",LOW:"pb-low"}[p]||"pb-low");
const initials=n=>(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase()||"?";
const snippet=(t="",l=90)=>{const s=t.replace(/\n/g," ").trim();return s.length>l?s.slice(0,l)+"…":s};

function formatTime(ts=""){
  if(!ts||["Just now","Uploaded Just Now","Now"].includes(ts)) return ts||"Now";
  try{
    const d=new Date(ts);
    if(isNaN(d)) return ts;
    const diff=Date.now()-d;
    if(diff<60000) return "Just now";
    if(diff<3600000) return Math.round(diff/60000)+"m ago";
    if(diff<86400000) return d.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
    return d.toLocaleDateString([],{month:"short",day:"numeric"});
  }catch{return ts}
}

function deadlineCountdown(normalized){
  if(!normalized) return null;
  const now=new Date();
  try{
    const target=new Date(normalized.replace(/\(.*\)/,"").trim());
    if(isNaN(target)) return null;
    const diff=target-now;
    const h=Math.round(diff/3600000);
    const d=Math.round(diff/86400000);
    if(h<0) return {label:"Overdue",cls:"dc-critical"};
    if(h<6) return {label:`Due in ${h} hour${h!==1?"s":""}`,cls:"dc-critical"};
    if(d<1) return {label:"Due Today",cls:"dc-urgent"};
    if(d===1) return {label:"Due Tomorrow",cls:"dc-urgent"};
    if(d<7) return {label:`Due in ${d} days`,cls:"dc-normal"};
    return {label:`Due ${target.toLocaleDateString([],{month:"short",day:"numeric"})}`,cls:"dc-normal"};
  }catch{return null}
}

// ── Toast ───────────────────────────────────────────────────────────────────
function Toast({msg,onDone}){
  useEffect(()=>{const t=setTimeout(onDone,2800);return()=>clearTimeout(t)},[]);
  return <div className="g-toast">{msg}</div>;
}

// ── Confidence Gauge (SVG) ───────────────────────────────────────────────────
function ConfGauge({pct,color}){
  const r=26,circ=2*Math.PI*r,dash=(pct/100)*circ;
  return (
    <div className="conf-gauge">
      <svg className="gauge-svg" width="64" height="64" viewBox="0 0 64 64">
        <circle className="gauge-bg" cx="32" cy="32" r={r}/>
        <circle className="gauge-fill" cx="32" cy="32" r={r}
          stroke={color} strokeDasharray={`${dash} ${circ}`}/>
      </svg>
      <div className="gauge-label">
        <span className="gauge-pct">{pct}%</span>
        <span className="gauge-sub">conf</span>
      </div>
    </div>
  );
}

// ── Interactive Action Checklist ─────────────────────────────────────────────
function ActionChecklist({actions}){
  const [checks,setChecks]=useState(()=>(actions||[]).map(()=>false));
  const done=checks.filter(Boolean).length;
  const total=checks.length;
  if(!total) return <p style={{fontSize:13,color:"var(--txt-muted)"}}>No action items detected.</p>;
  return (
    <div>
      <div className="task-progress">
        <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,color:"var(--txt-muted)",marginBottom:4}}>
          <span style={{fontWeight:600}}>{done} of {total} completed</span>
          <span>{Math.round((done/total)*100)}%</span>
        </div>
        <div className="task-progress-bar">
          <div className="task-progress-fill" style={{width:`${(done/total)*100}%`}}/>
        </div>
      </div>
      {actions.map((a,i)=>{
        const isDone=checks[i];
        const prio=(a.priority||"NORMAL").toUpperCase();
        const deadline=a.deadline&&a.deadline!=="No deadline specified"?a.deadline:null;
        return (
          <div key={i} className="task-row">
            <div className={`task-check ${isDone?"done":""}`}
              onClick={()=>setChecks(c=>{const n=[...c];n[i]=!n[i];return n})}>
              {isDone&&"✓"}
            </div>
            <div className="task-info">
              <div className={`task-action ${isDone?"done":""}`}>{a.action||String(a)}</div>
              <div className="task-meta">
                {a.responsible_person&&a.responsible_person!=="Unassigned"&&
                  <span className="task-pill tp-assignee">👤 {a.responsible_person}</span>}
                {deadline&&<span className="task-pill tp-deadline">📅 {deadline}</span>}
                <span className={`task-pill ${prio==="HIGH"?"tp-high":"tp-normal"}`}>{prio}</span>
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

// ── NLP Analysis Panel ───────────────────────────────────────────────────────
function NLPPanel({email}){
  const [open,setOpen]=useState({urgency:true,explain:false,actions:true,deadlines:true,category:false,summary:false,brief:false});
  const tog=k=>setOpen(o=>({...o,[k]:!o[k]}));
  const u=email?.urgency||{};
  const prio=u.priority||"LOW";
  const conf=Math.round((u.confidence||0)*100);
  const actions=email?.action_items||[];
  const deadlines=email?.deadlines||[];
  const cat=email?.category||{};
  const sum=email?.summary||"";
  const brief=email?.executive_brief||{};
  const signals=u.signals_breakdown||[];
  const color=pColor(prio);

  return (
    <div className="nlp-section">
      {/* Urgency Card */}
      <div className="nlp-card">
        <div className="nlp-header" onClick={()=>tog("urgency")}>
          <span>🎯</span><h4>Urgency Analysis</h4>
          <span className={`priority-badge ${pbClass(prio)}`}>{prio}</span>
          <span className="chevron" style={{transform:open.urgency?"rotate(180deg)":""}}>▼</span>
        </div>
        {open.urgency&&<div className="nlp-body">
          <div className="conf-gauge-wrap">
            <ConfGauge pct={conf} color={color}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:600,color:"var(--txt-primary)",marginBottom:4}}>
                Classified as <span style={{color}}>{prio}</span>
              </div>
              <div style={{fontSize:12,color:"var(--txt-muted)",marginBottom:6}}>
                Model: {u.model_name||"TF-IDF Ensemble"}
              </div>
              <div style={{height:7,borderRadius:999,background:"var(--border)",overflow:"hidden"}}>
                <div style={{width:conf+"%",height:"100%",background:color,borderRadius:999,transition:"width 1s ease"}}/>
              </div>
            </div>
          </div>
        </div>}
      </div>

      {/* Explainability Drawer */}
      <div className="nlp-card">
        <div className="nlp-header" onClick={()=>tog("explain")}>
          <span>🔬</span>
          <h4>Why {prio}? — AI Explanation</h4>
          <span className="chevron" style={{transform:open.explain?"rotate(180deg)":""}}>▼</span>
        </div>
        {open.explain&&<div className="nlp-body">
          {signals.length>0?(
            signals.map((s,i)=>(
              <div key={i} className="signal-row">
                <span className="signal-name">{s.signal}</span>
                <span className={`signal-weight ${s.weight>=0?"signal-pos":"signal-neg"}`}>
                  {s.weight>=0?"+":""}{s.weight?.toFixed(2)}
                </span>
              </div>
            ))
          ):(
            (u.signals||[]).map((s,i)=>(
              <div key={i} className="signal-row">
                <span className="signal-name">{s}</span>
                <span className={`signal-weight ${s.includes("Critical")||s.includes("High")||s.includes("VIP")?"signal-pos":"signal-neg"}`}>
                  {s.includes("Critical")?"+0.35":s.includes("High")||s.includes("Pattern")?"+0.25":s.includes("VIP")?"+0.30":"-0.10"}
                </span>
              </div>
            ))
          )}
          {signals.length===0&&(u.signals||[]).length===0&&
            <p style={{fontSize:13,color:"var(--txt-muted)"}}>No signals detected — classified by TF-IDF model features.</p>}
          <div style={{marginTop:12,padding:"10px 12px",background:"var(--surface2)",borderRadius:"var(--radius-md)",fontSize:12,color:"var(--txt-muted)"}}>
            Probabilities: {Object.entries(u.probabilities||{}).map(([k,v])=>`${k.toUpperCase()} ${Math.round(v*100)}%`).join(" · ")}
          </div>
        </div>}
      </div>

      {/* Action Items */}
      <div className="nlp-card">
        <div className="nlp-header" onClick={()=>tog("actions")}>
          <span>✅</span><h4>Action Items ({actions.length})</h4>
          <span className="chevron" style={{transform:open.actions?"rotate(180deg)":""}}>▼</span>

            ?<p style={{fontSize:13,color:"var(--txt-muted)"}}>No deadlines detected.</p>
            :<div style={{display:"flex",flexDirection:"column",gap:8}}>
              {deadlines.map((d,i)=>{
                const cd=deadlineCountdown(d.normalized||d.normalized_date);
                const task=d.task || (email.action_items && email.action_items[i] ? email.action_items[i].action : (email.action_items && email.action_items[0] ? email.action_items[0].action : null));
                return (
                  <div key={i} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"10px 12px",background:"var(--surface2)",borderRadius:"var(--radius-md)",border:"1px solid var(--border)"}}>
                    <span className={`deadline-chip ${cd?cd.cls:"dc-normal"}`} style={{margin:0,flexShrink:0}}>
                      📅 {cd?cd.label:(d.raw||d.text||String(d))}
                    </span>
                    <div style={{flex:1}}>
                      {task ? (
                        <div style={{fontSize:13,color:"var(--txt-primary)",lineHeight:1.45}}>

                          <strong>{task}</strong>

                      ) : (
                        <div style={{fontSize:12.5,color:"var(--txt-muted)",lineHeight:1.45}}>
                          <span style={{fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:".04em",display:"block",marginBottom:2}}>Reference context:</span>
                          "{d.raw||d.text||'Specified deadline'}"
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>}
        </div>}
      </div>

      {/* Executive Brief */}
      {brief.tldr&&<div className="nlp-card">
        <div className="nlp-header" onClick={()=>tog("brief")}>
          <span>📌</span><h4>Executive Brief</h4>
          <span className="chevron" style={{transform:open.brief?"rotate(180deg)":""}}>▼</span>
        </div>
        {open.brief&&<div className="nlp-body">
          <div className="exec-brief">
            <div className="eb-title">AI Structured Summary</div>
            <div className="eb-row">
              <span className="eb-icon">📌</span>
              <span className="eb-label">TL;DR</span>
              <span className="eb-text">{brief.tldr}</span>
            </div>
            {brief.key_decision&&<div className="eb-row" style={{marginTop:8}}>
              <span className="eb-icon">⚡</span>
              <span className="eb-label">Key Issue</span>
              <span className="eb-text">{brief.key_decision}</span>
            </div>}
            {brief.next_steps&&<div className="eb-row" style={{marginTop:8}}>
              <span className="eb-icon">🎯</span>
              <span className="eb-label">Next Steps</span>
              <span className="eb-text">{brief.next_steps}</span>
            </div>}
          </div>
        </div>}
      </div>}

      {/* Category */}
      <div className="nlp-card">
        <div className="nlp-header" onClick={()=>tog("category")}>
          <span>🏷️</span><h4>Email Category</h4>
          <span className="chevron" style={{transform:open.category?"rotate(180deg)":""}}>▼</span>
        </div>
        {open.category&&<div className="nlp-body">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <span style={{fontSize:22}}>{cat.icon||"📧"}</span>

              <div style={{fontSize:14,fontWeight:700,color:cat.color||"var(--txt-primary)"}}>{cat.category_label||cat.category||"GENERAL"}</div>
              <div style={{fontSize:11.5,color:"var(--txt-muted)"}}>{Math.round((cat.confidence||0)*100)}% confidence</div>

// ── Compose Modal ────────────────────────────────────────────────────────────
function ComposeModal({open,onClose,prefill,onSentSuccess}){
  const blank={to:"",subject:"",body:"",recipient_name:"",email_purpose:"",tone:"",user_name:"",additional_context:""};
  const [fields,setFields]=useState(blank);
  const [loading,setLoading]=useState(false);
  const [status,setStatus]=useState(null);

  useEffect(()=>{
    if(open) setFields({...blank,...(prefill||{})});
    else setStatus(null);
  },[open,JSON.stringify(prefill)]);

  const setF=k=>e=>setFields(f=>({...f,[k]:e.target.value}));

  const aiGenerate=async()=>{
    if(!fields.email_purpose&&!fields.body){alert("Enter a prompt in the AI bar first.");return}
    setLoading(true);setStatus(null);
    try{
      const r=await fetch(`${API}/api/compose`,{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({recipient_name:fields.recipient_name,email_purpose:fields.email_purpose||fields.body,
          tone:fields.tone,user_name:fields.user_name,topic_keywords:fields.subject,additional_context:fields.additional_context})});
      const d=await r.json();
      setFields(f=>({...f,subject:d.subject||f.subject,body:d.body||f.body}));
      setStatus({type:"info",text:"✨ AI draft ready — review and send!"});
    }catch(e){alert("AI generation failed: "+e.message)}
    setLoading(false);
  };

  const handleSend=()=>{
    if(!fields.to||!fields.to.includes("@")){alert("Please enter a valid recipient email.");return}
    const url=`https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(fields.to)}&su=${encodeURIComponent(fields.subject||"")}&body=${encodeURIComponent(fields.body||"")}`;
    window.open(url,"_blank");
    fetch(`${API}/api/send`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({to:fields.to,subject:fields.subject,body:fields.body,from_email:"Me",app_password:"gmail_web_dispatch"})
    }).then(r=>r.json()).then(d=>{if(onSentSuccess)onSentSuccess(d)}).catch(()=>{});
    onClose();
  };

  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="compose-modal open">
        <div className="modal-hd">
          <h3>✏️ New Message</h3>
          <button className="modal-close" onClick={onClose}>✕</button>
        </div>
        {status&&<div className={`modal-status ms-${status.type}`}><span>{status.text}</span><button style={{background:"none",border:"none",cursor:"pointer",marginLeft:"auto",color:"inherit"}} onClick={()=>setStatus(null)}>×</button></div>}
        <div className="compose-row">
          <span className="compose-label">To</span>
          <input className="compose-input" value={fields.to} onChange={setF("to")} placeholder="recipient@gmail.com" autoFocus/>
        </div>
        <div className="compose-row">
          <span className="compose-label">Subject</span>
          <input className="compose-input" value={fields.subject} onChange={setF("subject")} placeholder="Subject line"/>
        </div>
        {/* Reply draft toolbar / blank toggle */}
        {prefill?.quoted_only && (
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"7px 18px",background:"var(--surface2)",borderBottom:"1px solid var(--border2)",fontSize:12}}>
            <span style={{color:"var(--txt-muted)",display:"flex",alignItems:"center",gap:5}}>
              <span>💡</span>
              {fields.body&&fields.body.includes(prefill.draft_only||"__none__") ? "Contextual reply draft pre-filled" : "Reply draft"}
            </span>
            <div style={{display:"flex",gap:6}}>
              {prefill.draft_only && (
                <button type="button" className="d-btn" style={{padding:"3px 10px",fontSize:11.5}}
                  onClick={()=>setFields(f=>({...f,body:(prefill.draft_only+"\n\n"+prefill.quoted_only)}))}>
                  ✨ Context Draft
                </button>
              )}
              <button type="button" className="d-btn" style={{padding:"3px 10px",fontSize:11.5}}
                onClick={()=>setFields(f=>({...f,body:prefill.quoted_only||""}))}>
                ◻️ Leave Blank
              </button>
            </div>
          </div>
        )}
        <div className="ai-bar">
          <span style={{fontSize:15}}>✨</span>
          <input className="ai-input" value={fields.email_purpose} onChange={setF("email_purpose")}
            placeholder="Ask AI to draft… e.g. Request budget approval from CFO before Friday"
            onKeyDown={e=>e.key==="Enter"&&aiGenerate()}/>
          <button className="ai-draft-btn" onClick={aiGenerate} disabled={loading}>
            {loading?<><span className="spinner" style={{width:13,height:13}}/> Drafting…</>:"✨ Draft"}
          </button>
        </div>
        <textarea className="compose-body" value={fields.body} onChange={setF("body")}
          placeholder="Write your message here, or use the AI bar above to draft instantly…"/>
        <div className="modal-footer">
          <button className="send-gmail-btn" onClick={handleSend}>
            <span>📤</span> Send via Gmail
          </button>
          <span style={{fontSize:11.5,color:"var(--txt-muted)"}}>Opens Gmail with pre-filled content</span>
          <button className="discard-btn" onClick={onClose} title="Discard">🗑</button>
        </div>
      </div>
    </div>
  );
}

// ── Analyze Modal ─────────────────────────────────────────────────────────────
function AnalyzeModal({onClose,onResult}){
  const [subject,setSubject]=useState("");
  const [body,setBody]=useState("");
  const [sender,setSender]=useState("");
  const [loading,setLoading]=useState(false);
  const [result,setResult]=useState(null);
  const [file,setFile]=useState(null);
  const fileRef=useRef();

  const analyze=async()=>{
    if(!body.trim()&&!file){alert("Please enter email body or upload a file.");return}
    setLoading(true);setResult(null);
    try{
      let data;
      if(file){
        const fd=new FormData();fd.append("file",file);
        const r=await fetch(`${API}/api/upload`,{method:"POST",body:fd});
        data=await r.json();
      }else{
        const r=await fetch(`${API}/api/analyze`,{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({subject,body,sender,receiver:"Me",timestamp:new Date().toISOString()})});
        data=await r.json();
      }
      setResult(data);onResult(data);
    }catch(e){alert("Analysis failed: "+e.message)}
    setLoading(false);
  };

  const prio=result?.urgency?.priority;
  return (
    <div className="amodal" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>
      <div className="amodal-box">
        <div className="amodal-hd">
          <h2>🔍 Analyze Email</h2>
          <p>Paste email content or upload a .txt / .eml file for instant NLP analysis.</p>
        </div>
        <div className="amodal-body">
          {!result&&<>
            <div className="upload-zone" onClick={()=>fileRef.current.click()}>
              <input type="file" ref={fileRef} accept=".txt,.eml" onChange={e=>setFile(e.target.files[0])}/>
              <div style={{fontSize:32,marginBottom:8}}>📎</div>
              <div style={{fontSize:13.5,color:"var(--txt-muted)"}}>{file?file.name:"Drop a .txt or .eml file, or click to browse"}</div>
            </div>
            {!file&&<>
              <div className="modal-field"><label>From</label><input value={sender} onChange={e=>setSender(e.target.value)} placeholder="sender@example.com"/></div>
              <div className="modal-field"><label>Subject</label><input value={subject} onChange={e=>setSubject(e.target.value)} placeholder="Email subject…"/></div>
              <div className="modal-field"><label>Body</label><textarea value={body} onChange={e=>setBody(e.target.value)} placeholder="Paste email body here…"/></div>
            </>}
          </>}
          {result&&<div>
            <div style={{display:"flex",gap:8,marginBottom:14,flexWrap:"wrap"}}>
              {prio&&<span className="res-pill" style={{background:pColor(prio)}}>{prio}</span>}
              {result.category&&<span style={{fontSize:14}}>{result.category.icon} {result.category.category_label||result.category.category}</span>}
            </div>
            <NLPPanel email={result}/>
            <div style={{display:"flex",gap:8,marginTop:14}}>
              <button className="btn-analyze" onClick={()=>onClose()} style={{flex:1}}>📬 View in Reading Pane</button>
              <button className="btn-cancel" onClick={()=>{setResult(null);setFile(null);setSubject("");setBody("");setSender("")}}>← Analyze Another</button>
            </div>
          </div>}
        </div>
        <div className="amodal-footer">
          <button className="btn-cancel" onClick={onClose}>Close</button>
          {!result&&<button className="btn-analyze" onClick={analyze} disabled={loading}>
            {loading?<><span className="spinner" style={{width:14,height:14}}/> Analyzing…</>:"🔍 Analyze"}
          </button>}
        </div>
      </div>
    </div>
  );
}

    {name:"EmailSum Dataset",use:"Summarization Benchmarking",count:"2,549 threads",color:"#dc2626"},
  ];
  const rouge=[
    {name:"ROUGE-1 Recall",val:44.52},
    {name:"ROUGE-1 F1",val:19.56},
    {name:"ROUGE-2 Recall",val:14.68},
    {name:"ROUGE-L Recall",val:26.22},
  ];

  return (
    <div className="analytics-wrap">
      <div className="dash-heading">📊 Model Analytics &amp; Benchmarks</div>
      <div className="dash-sub">Live evaluation results for all 6 NLP capabilities — in-app, no JSON files needed.</div>

      <div className="analytics-grid">
        {/* Benchmark Card */}
        <div className="analytics-card">
          <div className="ac-title">🏆 Urgency Classification — Model Comparison</div>
          {benchmarks.map((b,i)=>(
            <div key={i} className="benchmark-row">
              <span className={`bm-name ${b.winner?"winner":""}`}>
                {b.winner&&<span className="bm-crown">👑</span>}{b.name}
              </span>
              <div className="bm-bar-wrap">
                <div className="bm-bar" style={{width:b.acc+"%",background:b.winner?"linear-gradient(90deg,#2563eb,#7c3aed)":"var(--border)"}}/>
              </div>
              <span className="bm-pct" style={{color:b.winner?"var(--blue)":"var(--txt-primary)"}}>{b.acc}%</span>
            </div>
          ))}
          <div style={{marginTop:12,fontSize:12,color:"var(--txt-muted)",padding:"8px 10px",background:"var(--surface2)",borderRadius:"var(--radius-md)"}}>
            Training: 1,807 samples | Test: 452 samples | Stratified 80/20 split · Customer Care Dataset
          </div>
        </div>

        {/* Per-Class Performance */}
        <div className="analytics-card">
          <div className="ac-title">📈 Per-Class Performance (Winning Ensemble)</div>
          {perClass.map((c,i)=>(
            <div key={i} className="per-class-row">
              <span className="pc-class" style={{color:c.color}}>{c.cls}</span>
              <div className="pc-metric">
                <div className="pc-label">Precision</div>
                <div className="pc-bar-wrap"><div className="pc-bar" style={{width:c.prec+"%",background:c.color}}/></div>

              <span className="pc-val">{c.prec}%</span>
              <div className="pc-metric" style={{marginLeft:8}}>
                <div className="pc-label">F1</div>
                <div className="pc-bar-wrap"><div className="pc-bar" style={{width:c.f1+"%",background:c.color,opacity:.7}}/></div>
              </div>
              <span className="pc-val">{c.f1}%</span>

        </div>

        {/* Dataset Breakdown */}
        <div className="analytics-card">
          <div className="ac-title">📚 Datasets Used Across Pipeline</div>
          {datasets.map((d,i)=>(
            <div key={i} className="ds-row">
              <div className="ds-dot" style={{background:d.color}}/>
              <span className="ds-name">{d.name}</span>
              <span className="ds-use">{d.use}</span>
              <span className="ds-count">{d.count}</span>
            </div>
          ))}
        </div>

        {/* ROUGE Meters */}
        <div className="analytics-card">
          <div className="ac-title">📝 Summarization Quality (ROUGE Scores)</div>
          {rouge.map((r,i)=>(
            <div key={i} className="rouge-row">
              <span className="rouge-name">{r.name}</span>
              <div className="rouge-bar-wrap"><div className="rouge-bar" style={{width:r.val+"%"}}/></div>
              <span className="rouge-val">{r.val}%</span>
            </div>
          ))}
          <div style={{marginTop:12,padding:"10px 12px",background:"var(--surface2)",borderRadius:"var(--radius-md)"}}>
            <div style={{fontSize:12,fontWeight:700,color:"var(--txt-muted)",marginBottom:6,textTransform:"uppercase",letterSpacing:".05em"}}>NLP Capabilities</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {[["Action Extraction","93.99% F1"],["Thread Grouping","81.74% NMI"],["Category","10 classes"],["Spam Detection","Lexicon Engine"]].map(([n,v])=>(
                <span key={n} style={{fontSize:11.5,padding:"3px 10px",borderRadius:999,background:"var(--blue-lt)",color:"var(--blue)",fontWeight:500}}>
                  {n}: <strong>{v}</strong>
                </span>
              ))}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Conversations View ────────────────────────────────────────────────────────
function ConversationsView({conversations}){
  const [expanded,setExp]=useState({});
  const tog=id=>setExp(e=>({...e,[id]:!e[id]}));
  if(!conversations||!conversations.length) return (
    <div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",color:"var(--txt-muted)"}}>
      <div style={{fontSize:48,marginBottom:12}}>💬</div>
      <div style={{fontSize:15,fontWeight:600}}>No conversations yet</div>
    </div>
  );
  return (
    <div className="conv-wrap">
      <div className="dash-heading" style={{marginBottom:4}}>💬 Conversations</div>
      <div className="dash-sub" style={{marginBottom:20}}>{conversations.length} conversation threads detected</div>
      {conversations.map((c,i)=>{
        const id=c.conversation_id||`conv_${i}`;
        const emails=c.emails||[];
        return (
          <div key={id} className="conv-card">
            <div className="conv-hd" onClick={()=>tog(id)}>
              <span style={{fontSize:20}}>🗂</span>
              <div className="conv-title-row">
                <div className="conv-title">{c.subject||"Untitled Thread"}</div>
                <div className="conv-parts">{(c.participants||[]).slice(0,3).join(", ")}</div>
              </div>
              <span className="conv-count">{emails.length} email{emails.length!==1?"s":""}</span>
              <span style={{color:"var(--txt-muted)",fontSize:11,marginLeft:8}}>{expanded[id]?"▲":"▼"}</span>
            </div>
            {expanded[id]&&<div className="conv-body">
              {c.summary&&<div className="conv-summary">📝 {c.summary}</div>}
              {c.key_points&&c.key_points.length>0&&<div style={{marginBottom:8}}>
                <strong style={{fontSize:11.5,color:"var(--txt-muted)",textTransform:"uppercase",letterSpacing:".05em"}}>Key Points</strong>
                <ul style={{marginTop:4,paddingLeft:16}}>
                  {c.key_points.map((p,j)=><li key={j} style={{fontSize:13,color:"var(--txt-primary)",marginBottom:3}}>{p}</li>)}
                </ul>
              </div>}
              {emails.map((e,j)=>(
                <div key={j} className="conv-email-row">
                  <strong>{e.sender}</strong> · {e.subject||"(No Subject)"} · {formatTime(e.timestamp)}
                </div>
              ))}
            </div>}
          </div>
        );
      })}
    </div>
  );
}

// ── Preferences View ──────────────────────────────────────────────────────────
function PreferencesView({prefs,onSave}){
  const [local,setLocal]=useState(prefs||{vip_senders:[],priority_topics:[],name:"Executive"});
  const [newVip,setNewVip]=useState("");
  const [newTopic,setNewTopic]=useState("");
  const [toast,setToast]=useState(false);
  useEffect(()=>{if(prefs)setLocal(prefs)},[JSON.stringify(prefs)]);
  const addVip=()=>{if(newVip.trim()){setLocal(l=>({...l,vip_senders:[...(l.vip_senders||[]),newVip.trim()]}));setNewVip("")}};
  const addTopic=()=>{if(newTopic.trim()){setLocal(l=>({...l,priority_topics:[...(l.priority_topics||[]),newTopic.trim()]}));setNewTopic("")}};
  const save=()=>{onSave(local);setToast(true);setTimeout(()=>setToast(false),3000)};
  return (
    <div className="prefs-wrap">
      {toast&&<Toast msg="✓ Preferences saved" onDone={()=>setToast(false)}/>}
      <div className="dash-heading">⚙️ Preferences</div>
      <div className="dash-sub" style={{marginBottom:24}}>Personalize how MailMind AI prioritizes your inbox.</div>
      <div className="pref-card">
        <h3>👤 Your Profile</h3>
        <div className="pref-row">
          <label>Display Name</label>
          <input value={local.name||""} onChange={e=>setLocal(l=>({...l,name:e.target.value}))} placeholder="Executive"/>
        </div>
      </div>
      <div className="pref-card">
        <h3>⭐ VIP Senders</h3>
        <p style={{fontSize:13,color:"var(--txt-muted)",marginBottom:12}}>Emails from these senders get a +0.30 urgency score boost.</p>
        <div className="pref-tags" style={{marginBottom:10}}>
          {(local.vip_senders||[]).map(v=><span key={v} className="pref-tag">{v}<button onClick={()=>setLocal(l=>({...l,vip_senders:(l.vip_senders||[]).filter(x=>x!==v)}))}>×</button></span>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <input style={{flex:1,padding:"7px 12px",border:"1.5px solid var(--border)",borderRadius:"var(--radius-md)",fontSize:13,background:"var(--surface2)",color:"var(--txt-primary)",outline:"none",fontFamily:"var(--font-sans)"}} value={newVip} onChange={e=>setNewVip(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addVip()} placeholder="ceo@company.com"/>
          <button className="pref-add" onClick={addVip}>+ Add</button>
        </div>
      </div>
      <div className="pref-card">
        <h3>🏷️ Priority Topics</h3>
        <p style={{fontSize:13,color:"var(--txt-muted)",marginBottom:12}}>Emails mentioning these topics get a +0.25 urgency boost.</p>
        <div className="pref-tags" style={{marginBottom:10}}>
          {(local.priority_topics||[]).map(t=><span key={t} className="pref-tag">{t}<button onClick={()=>setLocal(l=>({...l,priority_topics:(l.priority_topics||[]).filter(x=>x!==t)}))}>×</button></span>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <input style={{flex:1,padding:"7px 12px",border:"1.5px solid var(--border)",borderRadius:"var(--radius-md)",fontSize:13,background:"var(--surface2)",color:"var(--txt-primary)",outline:"none",fontFamily:"var(--font-sans)"}} value={newTopic} onChange={e=>setNewTopic(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addTopic()} placeholder="budget, deadline, CEO…"/>
          <button className="pref-add" onClick={addTopic}>+ Add</button>
        </div>
      </div>
      <button className="save-btn" onClick={save}>💾 Save Preferences</button>
    </div>
  );
}

// ── MAIN APP ──────────────────────────────────────────────────────────────────
function App(){
  const [view,setView]=useState("inbox");
  const [dashData,setDashData]=useState(null);
  const [emails,setEmails]=useState([]);
  const [conversations,setConversations]=useState([]);
  const [stats,setStats]=useState({});
  const [briefing,setBriefing]=useState({});
  const [prefs,setPrefs]=useState({});
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(null);
  const [filterPrio,setFilterPrio]=useState("ALL");
  const [filterCat,setFilterCat]=useState("ALL");
  const [search,setSearch]=useState("");
  const [compose,setCompose]=useState(false);
  const [composePreFill,setComposePreFill]=useState(null);
  const [showAnalyze,setShowAnalyze]=useState(false);
  const [toast,setToast]=useState(null);
  const [connected,setConnected]=useState(null);
  const [darkMode,setDarkMode]=useState(false);
  const searchRef=useRef();
  const priorityFilters=["ALL","CRITICAL","HIGH","MEDIUM","LOW"];

  const showToast=msg=>{setToast(msg);setTimeout(()=>setToast(null),3000)};

  // Dark mode toggle
  useEffect(()=>{
    document.documentElement.setAttribute("data-theme",darkMode?"dark":"light");
  },[darkMode]);

  // Load data
  useEffect(()=>{
    (async()=>{
      setLoading(true);
      try{
        const hRes=await fetch(`${API}/api/health`);
        if(!hRes.ok) throw new Error("offline");
        setConnected(true);
        const dRes=await fetch(`${API}/api/dashboard`);
        const d=await dRes.json();
        setDashData(d);
        const list=d.emails||[];
        setEmails(list);
        if(list.length>0) setSelected(list[0]);
        setConversations(d.conversations||[]);
        setStats(d.stats||{});
        setBriefing(d.daily_summary||{});
        const pRes=await fetch(`${API}/api/preferences`);
        setPrefs(await pRes.json());
      }catch{setConnected(false)}
      setLoading(false);
    })();
  },[]);

  const refreshInbox=async()=>{
    try{
      const r=await fetch(`${API}/api/dashboard`);
      const d=await r.json();
      const list=d.emails||[];
      setEmails(list);setStats(d.stats||{});setConversations(d.conversations||[]);setBriefing(d.daily_summary||{});
      setSelected(prev=>{
        if(!prev) return list[0]||null;
        return list.find(e=>(e.id&&prev.id&&e.id===prev.id)||(e.subject===prev.subject))||list[0]||null;
      });
      showToast("✓ Inbox refreshed");
    }catch(e){showToast("Refresh error: "+e.message)}
  };

  const handleAnalyzeResult=newEmail=>{
    setEmails(prev=>[newEmail,...prev.filter(e=>e.id!==newEmail.id)]);
    setSelected(newEmail);setView("inbox");
    showToast("✓ Email analyzed & opened!");
  };

  const generateReplyDraft=(email,mode="reply")=>{
    if(mode==="forward") return "";
    const senderName=(email.sender||"there").split("@")[0].replace(/[._]/g," ");
    const capSender=senderName.charAt(0).toUpperCase()+senderName.slice(1);
    const brief=email.executive_brief||{};
    const actions=(email.action_items||[]).filter(a=>a&&(a.action||typeof a==="string"));

    let bodyText="";
    if(brief.next_steps){
      bodyText=`Regarding the next steps (${brief.next_steps}), I am currently on it and will keep you posted with updates.`;
    }else if(actions.length>0){
      const firstTask=actions[0].action||(typeof actions[0]==="string"?actions[0]:"");
      bodyText=`I have noted the task: "${firstTask}". I will ensure it is handled promptly.`;
    }else if(brief.key_decision){
      bodyText=`Acknowledged regarding: "${brief.key_decision}". We are fully aligned on this approach.`;
    }else if(brief.tldr){
      bodyText=`Thank you for the update on: "${brief.tldr}". I have reviewed the details and will proceed accordingly.`;
    }else{
      bodyText=`Thank you for reaching out. I have reviewed your email and will follow up with you shortly.`;
    }

    return `Hi ${capSender},\n\n${bodyText}\n\nPlease let me know if you need any additional information.\n\nBest regards,\nMe`;
  };

  const handleReply=(email,mode="reply")=>{
    const smartDraft=generateReplyDraft(email,mode);
    const quotedHeader=mode==="reply"
      ?`\n\n---\nOn ${email.timestamp}, ${email.sender} wrote:\n${email.body}`
      :`\n\n---\nForwarded from ${email.sender}:\n${email.body}`;

    setComposePreFill({
      to:email.sender,
      subject:(mode==="reply"?"Re: ":"Fwd: ")+(email.subject||""),
      body:smartDraft ? (smartDraft + quotedHeader) : quotedHeader,
      draft_only:smartDraft,
      quoted_only:quotedHeader,
      recipient_name:email.sender.split("@")[0],
      topic_keywords:email.subject
    });
    setCompose(true);
  };

  const savePrefs=async(newPrefs)=>{
    try{
      const r=await fetch(`${API}/api/preferences`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(newPrefs)});
      setPrefs(await r.json());showToast("✓ Preferences saved");
    }catch(e){showToast("Error: "+e.message)}
  };

  // Filtering
  const filteredEmails=useMemo(()=>emails.filter(e=>{
    const prio=e.urgency?.priority||"LOW";
    const cat=e.category?.category||"GENERAL";
    if(filterPrio!=="ALL"&&prio!==filterPrio) return false;
    if(filterCat!=="ALL"&&cat!==filterCat) return false;
    if(view==="urgent") return ["CRITICAL","HIGH"].includes(prio);
    if(view==="spam") return cat==="SPAM";
    if(view==="critical") return prio==="CRITICAL";
    if(search){const q=search.toLowerCase();return(e.subject||"").toLowerCase().includes(q)||(e.sender||"").toLowerCase().includes(q)||(e.body||"").toLowerCase().includes(q)}
    return true;
  }),[emails,filterPrio,filterCat,view,search]);

  // Keyboard navigation
  useEffect(()=>{
    const handler=e=>{
      if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA") return;
      if(e.key==="/"||e.key==="c"||e.key==="C"||e.key==="j"||e.key==="k") e.preventDefault();
      if(e.key==="/"){searchRef.current?.focus()}
      if(e.key==="c"||e.key==="C"){setComposePreFill(null);setCompose(true)}
      if(e.key==="j"||e.key==="k"){
        const idx=filteredEmails.findIndex(em=>em.id===selected?.id);
        const next=e.key==="j"?Math.min(idx+1,filteredEmails.length-1):Math.max(idx-1,0);
        if(filteredEmails[next]) setSelected(filteredEmails[next]);
      }
    };
    window.addEventListener("keydown",handler);
    return()=>window.removeEventListener("keydown",handler);
  },[filteredEmails,selected]);

  const unreadCount=emails.filter(e=>e.unread!==false&&!e._read).length;
  const criticalCount=emails.filter(e=>e.urgency?.priority==="CRITICAL").length;
  const spamCount=emails.filter(e=>e.category?.category==="SPAM").length;

  const navItems=[
    {id:"dashboard",icon:"📊",label:"Dashboard",badge:0},
    {id:"inbox",icon:"📥",label:"Inbox",badge:unreadCount},
    {id:"urgent",icon:"⚡",label:"Urgent",badge:emails.filter(e=>["CRITICAL","HIGH"].includes(e.urgency?.priority)).length},
    {id:"critical",icon:"🚨",label:"Critical",badge:criticalCount},
    {id:"spam",icon:"🚫",label:"Spam",badge:spamCount},
    {id:"conversations",icon:"💬",label:"Conversations",badge:conversations.length},
    {id:"briefing",icon:"📋",label:"Daily Briefing",badge:0},
    {id:"analytics",icon:"📈",label:"Model Analytics",badge:0},
    {id:"preferences",icon:"⚙️",label:"Preferences",badge:0},
  ];

  const catItems=[
    {cat:"OPERATIONS",icon:"⚡",label:"Operations"},
    {cat:"ACTION_REQUIRED",icon:"✅",label:"Action Required"},
    {cat:"MEETING",icon:"📅",label:"Meetings"},
    {cat:"FINANCE",icon:"💰",label:"Finance"},
    {cat:"EXTERNAL",icon:"🌐",label:"Client / External"},
    {cat:"NEWSLETTER",icon:"📰",label:"Newsletters"},
  ];

  const isInboxView=!["dashboard","briefing","conversations","preferences","analytics"].includes(view);

  return (
    <>
    {toast&&<Toast msg={toast} onDone={()=>setToast(null)}/>}

    {/* TOP BAR */}
    <div className="topbar">
      <div className="logo">
        <div className="logo-mark">📧</div>
        <span className="logo-name">MailMind</span>
        <span className="logo-ai">AI</span>
      </div>
      <div className="search-wrap">
        <span className="search-icon">🔍</span>
        <input ref={searchRef} className="search-input" value={search} onChange={e=>setSearch(e.target.value)}
          placeholder="Search emails…" onFocus={()=>setView("inbox")}/>
        <span className="search-kbd"><kbd>/</kbd></span>
      </div>
      <div className="topbar-right">
        {connected===false&&<span className="status-pill status-offline"><span className="pulse-dot"/>Offline</span>}
        {connected===true&&<span className="status-pill status-online"><span className="pulse-dot"/>AI Ready</span>}
        <button className="icon-btn" title="Analyze Email" onClick={()=>setShowAnalyze(true)}>🔍</button>
        <button className="icon-btn" title="Refresh" onClick={refreshInbox}>🔄</button>
        <button className="icon-btn theme-toggle" title="Toggle Dark Mode" onClick={()=>setDarkMode(d=>!d)}>{darkMode?"☀️":"🌙"}</button>
        <div className="avatar">ME</div>
      </div>
    </div>

    {/* BODY */}
    <div className="body-wrap">
      {/* SIDEBAR */}
      <div className="sidebar">
        <button className="compose-btn" onClick={()=>{setComposePreFill(null);setCompose(true)}}>
          <span className="c-icon">✏️</span> Compose
        </button>
        <div className="nav-label">Mail</div>
        <div>
          {navItems.map(item=>(
            <div key={item.id} className={`nav-item ${view===item.id?"active":""}`} onClick={()=>setView(item.id)}>
              <span className="ni">{item.icon}</span>
              {item.label}
              {item.badge>0&&<span className="nav-badge">{item.badge}</span>}
            </div>
          ))}
        </div>
        <div className="nav-divider"/>
        <div className="nav-label">Categories</div>
        {catItems.map(({cat,icon,label})=>(
          <div key={cat} className={`nav-item ${filterCat===cat?"active":""}`}
            onClick={()=>{setFilterCat(filterCat===cat?"ALL":cat);setView("inbox")}}>
            <span className="ni">{icon}</span>{label}
          </div>
        ))}
        <div className="nav-divider"/>
        <div className="sidebar-footer">
          <div style={{fontSize:11,color:"var(--txt-muted)",lineHeight:1.6}}>
            <div style={{fontWeight:600,marginBottom:4}}>⌨️ Keyboard shortcuts</div>
            <div><kbd>/</kbd> Search · <kbd>C</kbd> Compose</div>
            <div><kbd>J</kbd>/<kbd>K</kbd> Navigate emails</div>
          </div>
        </div>
      </div>

      {/* MAIN AREA */}
      {loading
        ?<div style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,color:"var(--txt-muted)"}}>
          <div style={{fontSize:48}}>📧</div>
          <div style={{fontSize:16,fontWeight:600}}>Loading your emails…</div>
          <div className="skeleton" style={{width:220,height:5}}/>
        </div>

        :view==="dashboard"||view==="briefing"
          ?<DashboardView stats={stats} briefing={briefing}/>

        :view==="conversations"
          ?<ConversationsView conversations={conversations}/>

        :view==="analytics"
          ?<AnalyticsView/>

        :view==="preferences"
          ?<PreferencesView prefs={prefs} onSave={savePrefs}/>

        /* EMAIL LIST + READING PANE */
        :<>
          <div className="email-list">
            <div className="list-header">
              <span className="list-title">
                {view==="urgent"?"⚡ Urgent":view==="critical"?"🚨 Critical":view==="spam"?"🚫 Spam":"📥 Inbox"}
              </span>
              <span className="count-badge">{filteredEmails.length}</span>
              <button className="icon-btn" onClick={refreshInbox} title="Refresh" style={{marginLeft:"auto",width:30,height:30,fontSize:14}}>🔄</button>
            </div>
            <div className="filter-tabs">
              {priorityFilters.map(p=>(
                <button key={p} className={`filter-tab ${filterPrio===p?"active":""}`} onClick={()=>setFilterPrio(p)}>
                  {p==="ALL"?"All":p==="CRITICAL"?"🔴 Critical":p==="HIGH"?"🟠 High":p==="MEDIUM"?"🔵 Medium":"🟢 Low"}
                </button>
              ))}
            </div>
            <div className="email-items">
              {filteredEmails.length===0
                ?<div style={{padding:40,textAlign:"center",color:"var(--txt-muted)",fontSize:14}}>No emails match your filter.</div>
                :filteredEmails.map((email,i)=>{
                  const isSel=Boolean(selected&&((selected.id&&email.id&&selected.id===email.id)||(selected.subject===email.subject&&selected.timestamp===email.timestamp)||selected===email));
                  return <EmailRow key={email.id||i} email={email} selected={isSel} onClick={()=>setSelected(email)}/>;
                })}
            </div>
          </div>
          <ReadingPane
            key={selected?(selected.id||(selected.subject+selected.timestamp)):"empty"}
            email={selected}
            onReply={handleReply}
          />
        </>
      }
    </div>

    {/* MODALS */}
    <ComposeModal open={compose} onClose={()=>{setCompose(false);setComposePreFill(null)}} prefill={composePreFill}
      onSentSuccess={()=>{showToast("✓ Email opened in Gmail!");refreshInbox()}}/>
    {showAnalyze&&<AnalyzeModal onClose={()=>setShowAnalyze(false)} onResult={handleAnalyzeResult}/>}
    </>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App/>);
</script>
</body>
</html>
