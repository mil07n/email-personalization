<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Email Assistant – NLP Intelligence Suite</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#1e3a8a',
              950: '#0f172a',
            }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(226, 232, 240, 0.8); }
    .badge-critical { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    .badge-high { background-color: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
    .badge-medium { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
    .badge-low { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const API_BASE = "http://127.0.0.1:8000";

    function App() {
      const [activeTab, setActiveTab] = useState("dashboard"); // dashboard, inbox, analysis, conversations, summary, preferences
      const [dashboardData, setDashboardData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [selectedEmail, setSelectedEmail] = useState(null);
      const [preferences, setPreferences] = useState(null);
      const [statsData, setStatsData] = useState(null);

      // Search & Filters for Inbox
      const [searchQuery, setSearchQuery] = useState("");
      const [priorityFilter, setPriorityFilter] = useState("ALL");

      // Live Demo / Modal state
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [modalMode, setModalMode] = useState("manual"); // manual, sample, upload
      const [demoSubject, setDemoSubject] = useState("");
      const [demoBody, setDemoBody] = useState("");
      const [demoSender, setDemoSender] = useState("vip.client@enterprise.com");
      const [demoReceiver, setDemoReceiver] = useState("Executive User");
      const [analyzing, setAnalyzing] = useState(false);
      const [sampleList, setSampleList] = useState([]);

      // Fetch dashboard on mount
      useEffect(() => {
        fetchDashboard();
        fetchPreferences();
        fetchStats();
        fetchSampleList();
      }, []);

      const fetchDashboard = async () => {
        try {
          setLoading(true);
          const res = await fetch(`${API_BASE}/api/dashboard`);
          if (!res.ok) throw new Error("Backend server not responding");
          const data = await res.json();
          setDashboardData(data);
          if (data.emails && data.emails.length > 0 && !selectedEmail) {
            setSelectedEmail(data.emails[0]);
          }
          setError(null);
        } catch (err) {
          console.error(err);
          setError("Failed to connect to FastAPI backend at " + API_BASE + ". Make sure 'python backend/main.py' is running.");
        } finally {
          setLoading(false);
        }
      };

      const fetchPreferences = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/preferences`);
          if (res.ok) {
            const data = await res.json();
            setPreferences(data);
          }
        } catch (e) {}
      };

      const fetchStats = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/stats`);
          if (res.ok) {
            const data = await res.json();
            setStatsData(data);
          }
        } catch (e) {}
      };

      const fetchSampleList = async () => {
        try {
          const res = await fetch(`${API_BASE}/api/emails/sample`);
          if (res.ok) {
            const data = await res.json();
            setSampleList(data);
          }
        } catch (e) {}
      };

      const handleAnalyzeManual = async (e) => {
        e.preventDefault();
        if (!demoSubject || !demoBody) return;
        setAnalyzing(true);
        try {
          const res = await fetch(`${API_BASE}/api/analyze`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              subject: demoSubject,
              body: demoBody,
              sender: demoSender,
              receiver: demoReceiver,
              timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            })
          });
          if (res.ok) {
            const analyzed = await res.json();
            setSelectedEmail(analyzed);
            setIsModalOpen(false);
            setDemoSubject("");
            setDemoBody("");
            await fetchDashboard();
            setActiveTab("analysis");
          }
        } catch (err) {
          alert("Analysis error: " + err);
        } finally {
          setAnalyzing(false);
        }
      };

      const handlePickSample = (sample) => {
        setDemoSubject(sample.subject);
        setDemoBody(sample.body);
        setDemoSender(sample.sender);
        setDemoReceiver(sample.receiver || "Executive User");
      };

      const handleFileUpload = async (event) => {
        const file = event.target.files[0];
        if (!file) return;
        setAnalyzing(true);
        const formData = new FormData();
        formData.append("file", file);
        try {
          const res = await fetch(`${API_BASE}/api/upload`, {
            method: "POST",
            body: formData
          });
          if (res.ok) {
            const analyzed = await res.json();
            setSelectedEmail(analyzed);
            setIsModalOpen(false);
            await fetchDashboard();
            setActiveTab("analysis");
          } else {
            alert("File upload failed");
          }
        } catch (err) {
          alert("Upload error: " + err);
        } finally {
          setAnalyzing(false);
        }
      };

      const handleResetInbox = async () => {
        if (!confirm("Reset inbox back to the default demonstration emails?")) return;
        await fetch(`${API_BASE}/api/inbox/reset`, { method: "POST" });
        await fetchDashboard();
      };

      const handleSavePreferences = async (updated) => {
        try {
          const res = await fetch(`${API_BASE}/api/preferences`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(updated)
          });
          if (res.ok) {
            const data = await res.json();
            setPreferences(data);
            await fetchDashboard();
            alert("Preferences updated and inbox re-scored successfully!");
          }
        } catch (e) {
          alert("Failed to update preferences: " + e);
        }
      };

      const filteredEmails = useMemo(() => {
        if (!dashboardData || !dashboardData.emails) return [];
        return dashboardData.emails.filter(em => {
          const matchesPriority = priorityFilter === "ALL" || em.urgency?.priority === priorityFilter;
          const matchesSearch = !searchQuery ||
            em.subject.toLowerCase().includes(searchQuery.toLowerCase()) ||
            em.sender.toLowerCase().includes(searchQuery.toLowerCase()) ||
            em.body.toLowerCase().includes(searchQuery.toLowerCase());
          return matchesPriority && matchesSearch;
        });
      }, [dashboardData, priorityFilter, searchQuery]);

      // Priority Badge Renderer
      const renderBadge = (priority) => {
        switch (priority) {
          case "CRITICAL":
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold badge-critical inline-flex items-center gap-1">🔴 CRITICAL</span>;
          case "HIGH":
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold badge-high inline-flex items-center gap-1">🟠 HIGH</span>;
          case "MEDIUM":
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold badge-medium inline-flex items-center gap-1">🟡 MEDIUM</span>;
          default:
            return <span className="px-2.5 py-0.5 rounded-full text-xs font-semibold badge-low inline-flex items-center gap-1">🟢 LOW</span>;
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50">
          {/* Top Header */}
          <header className="bg-slate-900 border-b border-slate-800 text-white sticky top-0 z-30 shadow-md">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-bold text-xl">
                  ✉️
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight flex items-center gap-2">
                    Executive Email Assistant
                    <span className="text-xs bg-blue-500/20 text-blue-400 font-medium px-2 py-0.5 rounded border border-blue-500/30">NLP Powered</span>
                  </h1>
                  <p className="text-xs text-slate-400">Intelligent Urgency · Action Items · Deadlines · Daily Briefings</p>
                </div>
              </div>

              {/* Navigation Links */}
              <nav className="hidden md:flex items-center gap-1 bg-slate-800/80 p-1 rounded-xl border border-slate-700">
                {[
                  { id: "dashboard", label: "Dashboard", icon: "📊" },
                  { id: "inbox", label: "Email Inbox", icon: "📥" },
                  { id: "analysis", label: "Deep Analysis", icon: "🔍" },
                  { id: "conversations", label: "Conversations", icon: "💬" },
                  { id: "summary", label: "Daily Briefing", icon: "📋" },
                  { id: "preferences", label: "Preferences", icon: "⚙️" },
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => setActiveTab(tab.id)}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition-all flex items-center gap-1.5 ${
                      activeTab === tab.id
                        ? "bg-blue-600 text-white shadow-sm"
                        : "text-slate-300 hover:text-white hover:bg-slate-700/60"
                    }`}
                  >
                    <span>{tab.icon}</span>
                    <span>{tab.label}</span>
                  </button>
                ))}
              </nav>

              {/* Action Buttons */}
              <div className="flex items-center gap-2">
                <button
                  onClick={() => setIsModalOpen(true)}
                  className="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-1.5 shadow-sm transition-all shadow-emerald-600/20"
                >
                  <span>✨</span>
                  <span>Test New Email</span>
                </button>
                <button
                  onClick={fetchDashboard}
                  title="Refresh Data"
                  className="p-2 text-slate-400 hover:text-white hover:bg-slate-800 rounded-lg transition-colors"
                >
                  🔄
                </button>
              </div>
            </div>
          </header>

          {/* Subheader / Status Bar */}
          <div className="bg-white border-b border-slate-200 px-4 py-2 text-xs text-slate-500">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <span className="flex items-center gap-1.5 text-emerald-600 font-medium">
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  FastAPI NLP Backend: Online
                </span>
                <span>•</span>
                <span>Active Model: <strong>LinearSVC (TF-IDF)</strong> (83.6% accuracy on Customer Care)</span>
                <span>•</span>
                <span>Benchmark: <strong>EPA Dataset</strong> (94.0% F1 on Task Extraction)</span>
              </div>
              <div>
                <span>Demonstrating 5 Datasets: Enron, Customer Care, EmailThread, EPA, EmailSum</span>
              </div>
            </div>
          </div>

          {/* Error Alert */}
          {error && (
            <div className="max-w-7xl mx-auto px-4 mt-4">
              <div className="bg-rose-50 border border-rose-200 text-rose-800 px-4 py-3 rounded-xl flex items-center justify-between text-sm">
                <div className="flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{error}</span>
                </div>
                <button onClick={fetchDashboard} className="underline font-semibold hover:text-rose-900">Retry</button>
              </div>
            </div>
          )}

          {/* Main Content Area */}
          <main className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex-1 w-full">
            {loading ? (
              <div className="py-24 text-center">
                <div className="inline-block w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                <p className="mt-4 text-sm font-medium text-slate-600">Running NLP analysis and preparing executive intelligence suite...</p>
              </div>
            ) : (
              <div>
                {/* 1. DASHBOARD PAGE */}
                {activeTab === "dashboard" && (
                  <div className="space-y-6">
                    {/* Top Stats Metric Cards */}
                    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3.5">
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-slate-200">
                        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Total Inbox</div>
                        <div className="text-3xl font-extrabold text-slate-900 mt-1">{dashboardData?.stats?.total || 0}</div>
                        <div className="text-[11px] text-slate-400 mt-1">Incoming emails</div>
                      </div>
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-rose-200 bg-rose-50/30">
                        <div className="text-xs font-semibold text-rose-700 uppercase tracking-wider">Critical</div>
                        <div className="text-3xl font-extrabold text-rose-600 mt-1">{dashboardData?.stats?.critical || 0}</div>
                        <div className="text-[11px] text-rose-500 mt-1">Requires immediate response</div>
                      </div>
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-amber-200 bg-amber-50/30">
                        <div className="text-xs font-semibold text-amber-700 uppercase tracking-wider">High Priority</div>
                        <div className="text-3xl font-extrabold text-amber-600 mt-1">{dashboardData?.stats?.high || 0}</div>
                        <div className="text-[11px] text-amber-500 mt-1">Due today / escalated</div>
                      </div>
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-yellow-200 bg-yellow-50/30">
                        <div className="text-xs font-semibold text-yellow-700 uppercase tracking-wider">Medium</div>
                        <div className="text-3xl font-extrabold text-yellow-600 mt-1">{dashboardData?.stats?.medium || 0}</div>
                        <div className="text-[11px] text-yellow-500 mt-1">Standard follow-ups</div>
                      </div>
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-blue-200 bg-blue-50/30">
                        <div className="text-xs font-semibold text-blue-700 uppercase tracking-wider">Action Items</div>
                        <div className="text-3xl font-extrabold text-blue-600 mt-1">{dashboardData?.stats?.action_items || 0}</div>
                        <div className="text-[11px] text-blue-500 mt-1">Assigned tasks detected</div>
                      </div>
                      <div className="glass-card p-4 rounded-2xl shadow-sm border border-emerald-200 bg-emerald-50/30">
                        <div className="text-xs font-semibold text-emerald-700 uppercase tracking-wider">Deadlines</div>
                        <div className="text-3xl font-extrabold text-emerald-600 mt-1">{dashboardData?.stats?.deadlines || 0}</div>
                        <div className="text-[11px] text-emerald-500 mt-1">Recognized dates/times</div>
                      </div>
                    </div>

                    {/* Middle Two-Column Grid: Urgent Emails & Action Items */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      {/* Critical & High Priority Queue */}
                      <div className="glass-card rounded-2xl p-5 shadow-sm">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                          <h2 className="font-bold text-base text-slate-900 flex items-center gap-2">
                            <span>⚡</span>
                            <span>Critical & High Priority Queue</span>
                          </h2>
                          <button
                            onClick={() => { setPriorityFilter("HIGH"); setActiveTab("inbox"); }}
                            className="text-xs font-medium text-blue-600 hover:text-blue-800"
                          >
                            View All →
                          </button>
                        </div>
                        <div className="divide-y divide-slate-100 mt-2">
                          {dashboardData?.emails
                            ?.filter(e => e.urgency?.priority === "CRITICAL" || e.urgency?.priority === "HIGH")
                            .slice(0, 5)
                            .map((email, idx) => (
                              <div
                                key={idx}
                                onClick={() => { setSelectedEmail(email); setActiveTab("analysis"); }}
                                className="py-3 px-2 rounded-xl hover:bg-slate-50 cursor-pointer transition-colors flex items-start justify-between gap-3"
                              >
                                <div className="min-w-0 flex-1">
                                  <div className="flex items-center gap-2">
                                    {renderBadge(email.urgency?.priority)}
                                    <span className="text-xs text-slate-500 font-mono truncate">{email.sender}</span>
                                  </div>
                                  <h3 className="font-semibold text-sm text-slate-800 mt-1 truncate">{email.subject}</h3>
                                  <p className="text-xs text-slate-500 mt-0.5 line-clamp-1">{email.summary || email.body}</p>
                                </div>
                                <div className="text-[11px] text-slate-400 font-mono whitespace-nowrap">
                                  {email.timestamp}
                                </div>
                              </div>
                            ))}
                        </div>
                      </div>

                      {/* Pending Action Items & Deadlines */}
                      <div className="glass-card rounded-2xl p-5 shadow-sm">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                          <h2 className="font-bold text-base text-slate-900 flex items-center gap-2">
                            <span>✅</span>
                            <span>Action Items & Extracted Deadlines</span>
                          </h2>
                          <span className="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-mono">
                            EPA Dataset Addressee Engine
                          </span>
                        </div>
                        <div className="space-y-2.5 mt-3 max-h-[340px] overflow-y-auto pr-1">
                          {dashboardData?.daily_summary?.pending_action_items?.slice(0, 6).map((act, i) => (
                            <div key={i} className="p-3 bg-slate-50 border border-slate-200/80 rounded-xl hover:border-blue-300 transition-colors">
                              <div className="flex items-start justify-between gap-2">
                                <div className="font-semibold text-xs text-slate-900 flex items-center gap-1.5">
                                  <input type="checkbox" className="rounded text-blue-600" />
                                  <span>{act.action}</span>
                                </div>
                                <span className="text-[10px] font-mono bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded whitespace-nowrap">
                                  👤 {act.responsible_person}
                                </span>
                              </div>
                              <div className="flex items-center justify-between mt-2 text-[11px] text-slate-500">
                                <span className="truncate max-w-[200px]">Ref: {act.email_subject}</span>
                                {act.deadline && act.deadline !== "No deadline specified" && (
                                  <span className="text-amber-600 font-medium">⏳ {act.deadline}</span>
                                )}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>

                    {/* Bottom Section: Grouped Conversations & Executive Summary Preview */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      {/* Recent Conversation Threads */}
                      <div className="glass-card rounded-2xl p-5 shadow-sm lg:col-span-1">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                          <h2 className="font-bold text-base text-slate-900 flex items-center gap-2">
                            <span>💬</span>
                            <span>Conversation Threads</span>
                          </h2>
                          <button
                            onClick={() => setActiveTab("conversations")}
                            className="text-xs font-medium text-blue-600 hover:text-blue-800"
                          >
                            Explore All →
                          </button>
                        </div>
                        <div className="space-y-2.5 mt-3">
                          {dashboardData?.conversations?.slice(0, 4).map((conv, idx) => (
                            <div
                              key={idx}
                              onClick={() => setActiveTab("conversations")}
                              className="p-3 rounded-xl border border-slate-200 hover:border-blue-300 hover:bg-blue-50/30 cursor-pointer transition-all"
                            >
                              <div className="flex items-center justify-between">
                                <span className="text-xs font-semibold text-slate-800 truncate max-w-[180px]">{conv.subject}</span>
                                <span className="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded font-bold">
                                  {conv.num_emails} emails
                                </span>
                              </div>
                              <p className="text-[11px] text-slate-500 mt-1 line-clamp-2">{conv.summary}</p>
                            </div>
                          ))}
                        </div>
                      </div>

                      {/* Daily Executive Briefing Preview */}
                      <div className="glass-card rounded-2xl p-5 shadow-sm lg:col-span-2">
                        <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                          <h2 className="font-bold text-base text-slate-900 flex items-center gap-2">
                            <span>📋</span>
                            <span>Personalized Daily Executive Briefing</span>
                          </h2>
                          <button
                            onClick={() => setActiveTab("summary")}
                            className="bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded-lg text-xs"
                          >
                            Open Full Briefing →
                          </button>
                        </div>
                        <div className="mt-3 bg-slate-50 border border-slate-200 p-4 rounded-xl font-sans text-xs text-slate-700 space-y-2 leading-relaxed max-h-[300px] overflow-y-auto whitespace-pre-line font-mono">
                          {dashboardData?.daily_summary?.briefing_markdown}
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* 2. EMAIL INBOX PAGE */}
                {activeTab === "inbox" && (
                  <div className="glass-card rounded-2xl shadow-sm p-5 space-y-4">
                    <div className="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3 pb-3 border-b border-slate-200">
                      <div>
                        <h2 className="font-bold text-lg text-slate-900">Executive Email Inbox</h2>
                        <p className="text-xs text-slate-500">Classified, prioritized, and augmented with NLP intelligence</p>
                      </div>

                      {/* Filters */}
                      <div className="flex items-center gap-2 flex-wrap">
                        <input
                          type="text"
                          placeholder="Search sender, subject, body..."
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          className="px-3 py-1.5 bg-slate-100 rounded-lg text-xs border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 w-52"
                        />
                        <select
                          value={priorityFilter}
                          onChange={(e) => setPriorityFilter(e.target.value)}
                          className="px-3 py-1.5 bg-slate-100 rounded-lg text-xs border border-slate-300 focus:outline-none font-medium"

                      className="text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
                    />
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
